name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
Istilah webpack.yml paling kerap merujuk kepada fail konfigurasi GitHub Actions CI/CD workflow yang digunakan untuk membina (build) dan mengoptimumkan projek JavaScript berasaskan Webpack secara automatik. [1, 2] 
(Nota: Webpack itu sendiri dikonfigurasikan menggunakan fail JavaScript seperti webpack.config.js. Jika anda meletakkan .yml, ia biasanya diletakkan di dalam folder .github/workflows/webpack.yml projek anda). [2, 3, 4] 
Berikut adalah templat standard dan cara penggunaan fail webpack.yml untuk automasi CI/CD serta alternatif kegunaan lain.
------------------------------
## 1. Templat GitHub Actions Workflow (.github/workflows/webpack.yml)
Fail ini diletakkan di dalam projek anda untuk menguji atau membina aplikasi secara automatik setiap kali kod baharu ditolak (push) ke repositori: [1, 2] 

name: NodeJS with Webpack
# Menjalankan workflow ini apabila ada push atau pull request pada branch utamaon:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # Menguji pada pelbagai versi Node.js

    steps:
    # 1. Mengambil kod dari repositori
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Menyediakan persekitaran Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Mengaktifkan caching untuk mempercepatkan pemasangan

    # 3. Memasang dependensi (packages)
    - name: Install dependencies
      run: npm ci

    # 4. Menjalankan proses Webpack build
    - name: Build production bundle
      run: npx webpack --mode production

------------------------------
## 2. Konfigurasi Alternatif webpack.yml Lain
Bergantung kepada konteks projek anda, istilah ini juga mungkin merujuk kepada perkataan yang serupa dalam ekosistem pembangunan web:

* 
* Pemuat Fail YAML di Webpack (yaml-loader): Jika anda ingin memuatkan fail data berformat .yml atau .yaml ke dalam kod JavaScript anda menerusi Webpack, anda perlu memasang [yaml-loader pada GitHub](https://github.com/eemeli/yaml-loader) dan menambah tetapan di bawah dalam fail webpack.config.js (bukan dalam fail .yml): [5] 

module.exports = {
  module: {
    rules: [
      {
        test: /\.ya?ml$/,
        use: 'yaml-loader',
      },
    ],
  },
};

* Ruby on Rails (webpacker.yml): Jika anda menggunakan framework Ruby on Rails dengan permata (gem) Webpacker, fail config/webpacker.yml digunakan untuk mengawal tetapan kompilasi aset dev-server. [6] 
* 

------------------------------
## Ringkasan Ringkas Perbezaan Fail Konfigurasi

| Nama Fail | Fungsi Utama | Kegunaan Konteks |
|---|---|---|
| .github/workflows/webpack.yml | Automasi membina & menguji kod di awan (CI/CD). | GitHub Actions |
| webpack.config.js | Konfigurasi utama entri, output, dan loaders bagi Webpack. | Node.js / JavaScript |
| webpacker.yml | Menghubungkan tetapan Rails dengan kompilasi Webpack. | Ruby on Rails (Webpacker) |

